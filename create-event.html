<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Your Event | Captured Moments</title>

  <style>
    :root {
      --blue: #2563eb;
      --purple: #7c3aed;
      --orange: #f97316;
      --yellow: #facc15;
      --navy: #172033;
      --muted: #64748b;
      --light: #f5f8ff;
      --warm: #fffdf8;
      --border: #e2e8f0;
      --green: #22c55e;
      --gold: #c8a24a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--warm);
      color: var(--navy);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .navbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      background: white;
      border-bottom: 1px solid #eef2f7;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple)
        );
    }

    .logo span {
      color: var(--blue);
    }

    .back-link {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .back-link:hover {
      color: var(--blue);
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 55px 20px 80px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 38px;
    }

    .page-header h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.05;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    /* PACKAGE SELECTION */

    .package-section {
      margin-bottom: 40px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 22px;
    }

    .section-title h2 {
      margin: 0 0 7px;
      font-size: 1.6rem;
    }

    .section-title p {
      margin: 0;
      color: var(--muted);
    }

    .package-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .package-card {
      position: relative;
      padding: 28px;
      border: 2px solid var(--border);
      border-radius: 22px;
      background: white;
      transition: 0.2s ease;
    }

    .package-card:hover {
      border-color: #cbd5e1;
      transform: translateY(-2px);
    }

    .package-card.plus {
      border-color: var(--purple);
      box-shadow:
        0 15px 40px rgba(124, 58, 237, 0.12);
    }
