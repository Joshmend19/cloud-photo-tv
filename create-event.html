<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Your Event | Cloud Photo TV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #5b4848;
      background:
        radial-gradient(circle at 15% 10%, #f8e6e4, transparent 32%),
        radial-gradient(circle at 85% 90%, #f8edda, transparent 30%),
        linear-gradient(160deg, #fffaf8, #fffdfb);
    }

    .page {
      width: min(760px, 92%);
      margin: 0 auto;
      padding: 50px 0 70px;
    }

    .brand {
      text-align: center;
      color: #b47c7c;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      margin: 0;
      color: #765555;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 7vw, 58px);
      font-weight: 500;
    }

    .intro {
      text-align: center;
      color: #8b7777;
      margin: 12px auto 35px;
      max-width: 560px;
      line-height: 1.6;
    }

    .card {
      background: rgba(255,255,255,.97);
      border: 1px solid #ead6d6;
      border-radius: 24px;
      padding: 30px;
      box-shadow:
        0 24px 70px rgba(155,105,105,.13),
        0 3px 10px rgba(180,140,80,.06);
    }

    .section {
      margin-bottom: 28px;
    }

    .sectionTitle {
      color: #8f6262;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    label {
      display: block;
      color: #765f5f;
      font-size: 14px;
      font-weight: 750;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #d9c2c0;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      outline: none;
      background: #fffdfc;
      color: #594848;
    }

    input:focus,
    select:focus {
      border-color: #c28b8b;
      box-shadow: 0 0 0 4px rgba(194,139,139,.12);
    }

    .field {
      margin-bottom: 16px;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .themeGrid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .themeOption {
      border: 1px solid #ead6d6;
      border-radius: 14px;
      padding: 15px;
      background: #fffaf8;
      cursor: pointer;
      transition: .2s ease;
    }

    .themeOption:hover {
      border-color: #c28b8b;
      transform: translateY(-1px);
    }

    .themeOption input {
      width: auto;
      margin-right: 8px;
    }

    .themeName {
      font-weight: 750;
      color: #765555;
    }

    .themeDescription {
      display: block;
      margin-top: 4px;
      color: #9b8585;
      font-size: 13px;
    }

    .colors {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .colorBox {
      text-align: center;
    }

    .colorBox label {
      margin-bottom: 8px;
    }

    input[type="color"] {
      height: 52px;
      padding: 4px;
      cursor: pointer;
    }

    .createBtn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 800;
      background: linear-gradient(135deg, #b97979, #c9918b);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(180,115,115,.22);
    }

    .createBtn:hover {
      background: linear-gradient(135deg, #aa6c6c, #bd827d);
    }

    .status {
      min-height: 24px;
      text-align: center;
      margin-top: 14px;
      color: #806e6e;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .page {
        padding-top: 30px;
      }

      .card {
        padding: 22px;
        border-radius: 20px;
      }

      .two,
      .colors,
      .themeGrid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brand">☁ Cloud Photo TV</div>

    <h1>Create Your Event</h1>

    <p class="intro">
      Create a personalized photo experience for your next event.
      Your event will have its own QR code, TV display, and photo gallery.
    </p>

    <div class="card">

      <div class="section">

        <div class="sectionTitle">1. Event Information</div>

        <div class="field">
          <label for="eventType">Event Type</label>

          <select id="eventType">
            <option value="birthday">Birthday</option>
            <option value="graduation">Graduation</option>
            <option value="wedding">Wedding</option>
            <option value="retirement">Retirement</option>
            <option value="baby-shower">Baby Shower</option>
            <option value="anniversary">Anniversary</option>
            <option value="sports">Sports Event</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="eventName">Event Name</label>

          <input
            id="eventName"
            type="text"
            placeholder="Donna's 60th Birthday"
          >
        </div>

      </div>

      <div class="section">

        <div class="sectionTitle">2. Date & Time</div>

        <div class="two">

          <div class="field">
            <label for="eventDate">Event Date</label>

            <input
              id="eventDate"
              type="date"
            >
          </div>

          <div></div>

          <div class="field">
            <label for="startTime">Start Time</label>

            <input
              id="startTime"
              type="time"
            >
          </div>

          <div class="field">
            <label for="endTime">End Time</label>

            <input
              id="endTime"
              type="time"
            >
          </div>

        </div>

      </div>

      <div class="section">

        <div class="sectionTitle">3. Choose a Theme</div>

        <div class="themeGrid">

          <label class="themeOption">
            <input
              type="radio"
              name="theme"
              value="classic"
              checked
            >
            <span class="themeName">Classic</span>
            <span class="themeDescription">
              Clean and elegant
            </span>
          </label>

          <label class="themeOption">
            <input
              type="radio"
              name="theme"
              value="elegant"
            >
            <span class="themeName">Elegant</span>
            <span class="themeDescription">
              Rose, gold & luxury
            </span>
          </label>

          <label class="themeOption">
            <input
              type="radio"
              name="theme"
              value="celebration"
            >
            <span class="themeName">Celebration</span>
            <span class="themeDescription">
              Fun and colorful
            </span>
          </label>

          <label class="themeOption">
            <input
              type="radio"
              name="theme"
              value="modern"
            >
            <span class="themeName">Modern</span>
            <span class="themeDescription">
              Simple and contemporary
            </span>
          </label>

        </div>

      </div>

      <div class="section">

        <div class="sectionTitle">4. Choose Your Colors</div>

        <div class="colors">

          <div class="colorBox">
            <label for="primaryColor">Primary</label>
            <input
              id="primaryColor"
              type="color"
              value="#b97979"
            >
          </div>

          <div class="colorBox">
            <label for="secondaryColor">Background</label>
            <input
              id="secondaryColor"
              type="color"
              value="#fffaf8"
            >
          </div>

          <div class="colorBox">
            <label for="accentColor">Accent</label>
            <input
              id="accentColor"
              type="color"
              value="#c8a24a"
            >
          </div>

        </div>

      </div>

      <div class="section">

        <div class="sectionTitle">5. Background & Logo</div>

        <div class="field">
          <label for="background">Background Design</label>

          <select id="background">
            <option value="default">Classic</option>
            <option value="soft">Soft & Elegant</option>
            <option value="celebration">Celebration</option>
            <option value="minimal">Minimal</option>
          </select>
        </div>

        <div class="field">
          <label for="logo">Optional Event Logo or Photo</label>

          <input
            id="logo"
            type="file"
            accept="image/jpeg,image/png,image/webp"
          >
        </div>

      </div>

      <button id="createBtn" class="createBtn">
        Continue to Checkout
      </button>

      <div id="status" class="status"></div>

    </div>

  </main>

  <script type="module" src="create-event.js"></script>

</body>
</html>
