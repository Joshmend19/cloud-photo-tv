<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Donna's 60th Birthday</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background:
        radial-gradient(circle at top, #fff8f8 0%, #ffffff 45%, #fffaf5 100%);
      color: #4a3b3b;
      overflow-x: hidden;
    }

    .galleryWrap {
      width: min(1200px, 94%);
      margin: 0 auto;
      padding: 55px 0 70px;
      position: relative;
      z-index: 2;
    }

    /* Decorative roses */

    .roseSide {
      position: fixed;
      top: 45px;
      width: 170px;
      z-index: 1;
      pointer-events: none;
      opacity: .95;
    }

    .roseLeft {
      left: 10px;
    }

    .roseRight {
      right: 10px;
      transform: scaleX(-1);
    }

    .rose {
      font-size: 70px;
      line-height: .8;
      filter:
        drop-shadow(0 8px 12px rgba(150, 90, 90, .16));
    }

    .rose:nth-child(2) {
      margin-left: 48px;
      margin-top: 10px;
      font-size: 58px;
    }

    .leaves {
      color: #a58b55;
      font-size: 28px;
      margin-left: 18px;
      margin-top: 8px;
      letter-spacing: 8px;
    }

    .galleryHead {
      text-align: center;
      margin-bottom: 28px;
      position: relative;
      z-index: 3;
    }

    .eventLogo {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .16em;
      color: #b77b7b;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .galleryHead h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 6vw, 64px);
      font-weight: 500;
      color: #8f5f62;
      letter-spacing: -.02em;
    }

    .goldLine {
      width: 90px;
      height: 2px;
      margin: 18px auto;
      background: linear-gradient(
        90deg,
        #c8a24a,
        #e7c873,
        #c8a24a
      );
    }

    .gallerySubtitle {
      margin: 0;
      color: #8b7b7b;
      font-size: 16px;
    }

    #galleryStatus {
      margin-top: 12px;
      color: #b08a8a;
      font-size: 14px;
    }

    .downloadAll {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      border: 1px solid #d2b06a;
      border-radius: 13px;
      padding: 12px 20px;
      background: linear-gradient(135deg, #fffdf7, #fff8e9);
      color: #96752e;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 7px 20px rgba(180, 140, 70, .12);
      transition: .2s ease;
    }

    .downloadAll:hover {
      background: #fff4d7;
      border-color: #c49b45;
      transform: translateY(-1px);
    }

    .downloadAll:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      position: relative;
      z-index: 3;
    }

    .card {
      background: white;
      border: 1px solid #ead6d6;
      border-radius: 18px;
      padding: 8px;
      box-shadow:
        0 10px 30px rgba(155, 105, 105, .10),
        0 2px 5px rgba(180, 140, 80, .06);
      transition: .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #d8b0b0;
      box-shadow:
        0 16px 35px rgba(155, 105, 105, .15),
        0 3px 8px rgba(180, 140, 80, .08);
    }

    .card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }

    .photoActions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .viewBtn,
    .downloadBtn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      border-radius: 9px;
      padding: 9px 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .viewBtn {
      color: #8f6262;
      background: #fff7f5;
      border: 1px solid #ead6d6;
    }

    .downloadBtn {
      color: #96752e;
      background: #fffaf0;
      border: 1px solid #e4cc91;
    }

    .viewBtn:hover {
      background: #fff0ed;
    }

    .downloadBtn:hover {
      background: #fff3d9;
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
      color: #8b7b7b;
      grid-column: 1 / -1;
    }

    @media (max-width: 900px) {
      .roseSide {
        opacity: .5;
        width: 110px;
      }

      .rose {
        font-size: 50px;
      }

      .rose:nth-child(2) {
        font-size: 42px;
      }
    }

    @media (max-width: 600px) {
      .roseSide {
        display: none;
      }

      .galleryWrap {
        padding-top: 40px;
      }

      .galleryHead h1 {
        font-size: 40px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .viewBtn,
      .downloadBtn {
        font-size: 12px;
        padding: 8px 4px;
      }
    }
  </style>
</head>

<body>

  <!-- Left roses -->
  <div class="roseSide roseLeft">
    <div class="rose">🌹</div>
    <div class="rose">🌹</div>
    <div class="leaves">✦ ✦</div>
  </div>

  <!-- Right roses -->
  <div class="roseSide roseRight">
    <div class="rose">🌹</div>
    <div class="rose">🌹</div>
    <div class="leaves">✦ ✦</div>
  </div>

  <main class="galleryWrap">

    <header class="galleryHead">

      <div class="eventLogo">
        Donna's 60th Birthday
      </div>

      <h1>Celebrating 60 Years</h1>

      <div class="goldLine"></div>

      <p class="gallerySubtitle">
        A collection of memories from a special day
      </p>

      <p id="galleryStatus">
        Loading photos…
      </p>

      <button id="downloadAll" class="downloadAll">
        ↓ Download All Photos
      </button>

    </header>

    <section id="grid" class="grid"></section>

  </main>

  <script type="module" src="gallery.js"></script>

</body>
</html>
