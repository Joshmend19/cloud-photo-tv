      --primary-color: #2563eb;

      --accent-color: #c8a24a;
      --navy: #172033;
      --light-background: #f5f8ff;
      --card-background: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light-background);
      color: var(--navy);
      position: relative;
      overflow-x: hidden;
    }

    /* =========================
       EVENT THEME PATTERNS
       ========================= */

    body::before,
    body::after {
      content: "";
      position: fixed;
      top: -50px;
      left: 200px;
      width: calc(100% + 100px);
      height: calc(100% + 100px);
      padding: 20px;
      font-size: 42px;
      line-height: 2.15;
      letter-spacing: 3px;
      white-space: pre;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    import {
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    } from "./config.js";

    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const params =
      new URLSearchParams(
        window.location.search
      );

    const code =
      (params.get("code") || "")
        .toUpperCase();

    if (code) {

      try {

        const {
          data,
          error
        } =
          await supabase.rpc(
            "get_public_event",
            {
              p_code: code
            }
          );

        if (error) {
          throw error;
        }

        const event =
          Array.isArray(data)
            ? data[0]
            : data;

        if (event) {

          document.documentElement.style.setProperty(
            "--primary-color",
            event.primary_color || "#2563eb"
          );

          document.documentElement.style.setProperty(
            "--secondary-color",
            event.secondary_color || "#fffdf8"
          );

          document.documentElement.style.setProperty(
            "--accent-color",
            event.accent_color || "#c8a24a"
          );

          if (event.theme) {
            document.body.dataset.theme =
              event.theme;
          }

        }

      } catch (error) {

        console.error(
          "GALLERY COLOR ERROR:",
          error
        );

      }

    }

  </script>
