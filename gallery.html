<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Event Gallery | Captured Moments</title>

  <style>
    :root {
      --primary-color: #2563eb;
      --secondary-color: #fffdf8;
      --accent-color: #c8a24a;
      --navy: #172033;
      --light-background: #f5f8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light-background);
      color: var(--navy);
    }

    .top-bar {
      height: 6px;
      background: linear-gradient(
        90deg,
        var(--primary-color),
        var(--accent-color)
      );
    }

    nav {
      background: var(--secondary-color);
      padding: 18px 24px;
      border-bottom: 1px solid #e5e7eb;
    }

    .nav-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: linear-gradient(
        135deg,
        var(--primary-color),
        var(--accent-color)
      );
    }

    .logo span {
      color: var(--primary-color);
    }

    .back-link {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 700;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 50px 20px 70px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 42px;
    }

    .hero p {
      margin: 0;
      color: #64748b;
      font-size: 17px;
    }

    .event-code {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 14px;
      border-radius: 999px;
      background: color-mix(
        in srgb,
        var(--primary-color) 12%,
        white
      );
      color: var(--primary-color);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      color: white;
      background: linear-gradient(
        135deg,
        var(--primary-color),
        var(--accent-color)
      );
    }

    .secondary {
      background: var(--secondary-color);
      color: var(--navy);
      border: 1px solid #dbe2ea;
    }

    button:hover {
      opacity: 0.9;
    }

    .status {
      text-align: center;
      min-height: 25px;
      margin-bottom: 20px;
      color: #64748b;
      font-weight: 600;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(220px, 1fr)
      );
      gap: 18px;
    }

    .photo-card {
      background: var(--secondary-color);
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 8px 25px rgba(
          23,
          32,
          51,
          0.08
        );
    }

    .photo-card img {
      display: block;
      width: 100%;
      height: 250px;
      object-fit: cover;
      background: #e5e7eb;
    }

    .photo-footer {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .photo-number {
      color: #64748b;
      font-size: 13px;
    }

    .download-link {
      color: var(--primary-color);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
      background: var(--secondary-color);
      border-radius: 20px;
      color: #64748b;
    }

    .empty h2 {
      color: var(--navy);
      margin-top: 0;
    }

    @media (max-width: 600px) {

      .hero h1 {
        font-size: 32px;
      }

      .gallery {
        grid-template-columns: repeat(
          2,
          minmax(0, 1fr)
        );
        gap: 12px;
      }

      .photo-card img {
        height: 180px;
      }

      .nav-inner {
        gap: 15px;
      }

      .back-link {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar"></div>

  <nav>
    <div class="nav-inner">

      <div class="logo">
        <div class="logo-mark">✦</div>
        Captured <span>Moments</span>
      </div>

      <a
        href="index.html"
        class="back-link"
      >
        Captured Moments
      </a>

    </div>
  </nav>


  <main>

    <section class="hero">

      <h1 id="eventName">
        Event Gallery
      </h1>

      <p>
        All the moments shared from this event.
      </p>

      <div
        id="eventCode"
        class="event-code"
      >
        EVENT ------
      </div>

    </section>


    <section class="actions">

      <button
        id="downloadAllBtn"
        class="primary"
      >
        Download All Photos
      </button>

    </section>


    <div
      id="status"
      class="status"
    >
      Loading photos...
    </div>


    <section
      id="gallery"
      class="gallery"
    ></section>


  </main>


  <script
    type="module"
    src="./gallery.js"
  ></script>


  <!-- Load the event's saved colors -->

  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    import {
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    } from "./config.js";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const params =
      new URLSearchParams(
        window.location.search
      );


    const code =
      (params.get("code") || "")
        .toUpperCase();


    if (code) {

      try {

        const {
          data: event,
          error
        } =
          await supabase
            .from("events")
            .select(
              "primary_color, secondary_color, accent_color"
            )
            .eq(
              "code",
              code
            )
            .single();


        if (!error && event) {

          document.documentElement.style.setProperty(
            "--primary-color",
            event.primary_color || "#2563eb"
          );

          document.documentElement.style.setProperty(
            "--secondary-color",
            event.secondary_color || "#fffdf8"
          );

          document.documentElement.style.setProperty(
            "--accent-color",
            event.accent_color || "#c8a24a"
          );

        }

      } catch (error) {

        console.error(
          "GALLERY COLOR ERROR:",
          error
        );

      }

    }

  </script>

</body>
</html>
