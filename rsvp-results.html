<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RSVP Results | Captured Moments</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5f2;
      color: #2f2a27;
    }

    .top-bar {
      height: 8px;
      background: linear-gradient(
        90deg,
        #c9a27e,
        #e8d5c0,
        #b88962
      );
    }

    header {
      background: white;
      border-bottom: 1px solid #e5ddd6;
      padding: 24px 20px;
      text-align: center;
    }

    .brand {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 6px;
      color: #746b65;
      font-size: 15px;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px 60px;
    }

    .event-card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      margin-bottom: 24px;
    }

    .event-name {
      margin: 0;
      font-size: 30px;
    }

    .event-date {
      margin-top: 8px;
      color: #746b65;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 24px;
    }

    .stat {
      background: #f8f4f0;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 700;
    }

    .stat-label {
      margin-top: 5px;
      color: #746b65;
      font-size: 14px;
    }

    .results-card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      overflow-x: auto;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .results-header h2 {
      margin: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #eee7e1;
      vertical-align: top;
    }

    th {
      font-size: 13px;
      color: #746b65;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      font-size: 14px;
    }

    .attending {
      color: #34734a;
      font-weight: 700;
    }

    .not-attending {
      color: #9b4b4b;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #746b65;
    }

    .status {
      margin-bottom: 20px;
      font-size: 14px;
      color: #746b65;
    }

    .error {
      color: #a33a3a;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .event-name {
        font-size: 24px;
      }

      main {
        margin-top: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar"></div>

  <header>
    <div class="brand">Captured Moments</div>
    <div class="subtitle">
      RSVP Results
    </div>
  </header>

  <main>

    <section class="event-card">

      <h1
        id="eventName"
        class="event-name"
      >
        Loading event...
      </h1>

      <div
        id="eventDate"
        class="event-date"
      >
      </div>

      <div class="stats">

        <div class="stat">
          <div
            id="totalRsvps"
            class="stat-number"
          >
            0
          </div>

          <div class="stat-label">
            Total RSVPs
          </div>
        </div>

        <div class="stat">
          <div
            id="attendingCount"
            class="stat-number"
          >
            0
          </div>

          <div class="stat-label">
            Attending
          </div>
        </div>

        <div class="stat">
          <div
            id="guestCountTotal"
            class="stat-number"
          >
            0
          </div>

          <div class="stat-label">
            Total Guests
          </div>
        </div>

      </div>

    </section>

    <section class="results-card">

      <div class="results-header">
        <h2>Guest Responses</h2>
      </div>

      <div
        id="status"
        class="status"
      >
        Loading RSVPs...
      </div>

      <div id="resultsContainer">
      </div>

    </section>

  </main>

  <script
    type="module"
    src="rsvp-results.js"
  ></script>

</body>
</html>
