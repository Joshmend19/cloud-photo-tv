<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

  <title>Captured Moments TV</title>

  <style>

    :root {
      --primary-color: #2563eb;
      --secondary-color: #111827;
      --accent-color: #c8a24a;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;

      background:
        var(--secondary-color);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;
    }


    .hidden {
      display: none !important;
    }


    #loading,
    #tvView,
    #uploadView {
      width: 100%;
      height: 100%;
    }


    #loading {
      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 30px;
    }


    #loading h2 {
      color: var(--primary-color);
    }


    /* ---------------------------------
       DEFAULT TV BACKGROUND
    --------------------------------- */

    #tvView {
      position: relative;

      background:
        radial-gradient(
          circle at top left,
          color-mix(
            in srgb,
            var(--primary-color) 35%,
            transparent
          ),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          color-mix(
            in srgb,
            var(--accent-color) 35%,
            transparent
          ),
          transparent 35%
        ),
        var(--secondary-color);

      overflow: hidden;
    }

       BIRTHDAY - BALLOONS & CONFETTI
    --------------------------------- */

            in srgb,
            var(--primary-color) 35%,
            transparent

          transparent 25%
        ),
        radial-gradient(
          circle at 90% 15%,
          color-mix(
            in srgb,
            var(--accent-color) 35%,
            transparent
          ),
          transparent 25%
        ),
        radial-gradient(
          circle at 10% 85%,
          color-mix(
            in srgb,
            var(--accent-color) 30%,
            transparent
          ),
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 85%,
          color-mix(
            in srgb,
            var(--primary-color) 30%,

        .toUpperCase();


    async function loadEventDesign() {

      if (!code) {
        return;
      }


      try {

        const {
          data,
          error
        } =
          await supabase.rpc(
            "get_public_event",
            {
              p_code: code
            }
          );


        if (error) {
          throw error;
        }


        const event =
          Array.isArray(data)
            ? data[0]
            : data;


        if (!event) {

          throw new Error(
            "Event not found."
          );

        }


        document.documentElement.style.setProperty(
          "--primary-color",
          event.primary_color || "#2563eb"
        );


        document.documentElement.style.setProperty(
          "--secondary-color",
          event.secondary_color || "#111827"
        );


        document.documentElement.style.setProperty(
          "--accent-color",
          event.accent_color || "#c8a24a"
        );


        if (event.theme) {

          document.body.dataset.theme =
            event.theme;

        }


        console.log(
          "TV design loaded:",
          event.theme
        );


        console.log(
          "TV colors loaded:",
          event.primary_color,
          event.secondary_color,
          event.accent_color
        );


      } catch (error) {

        console.error(
          "Could not load event design:",
          error
        );

      }

    }


    loadEventDesign();

  </script>
