<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Captured Moments TV</title>

  <style>

    :root {
      --primary-color: #2563eb;
      --secondary-color: #111827;
      --accent-color: #c8a24a;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;

      width: 100%;
      height: 100%;

      background:
        var(--secondary-color);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;
    }


    .hidden {
      display: none !important;
    }


    #loading,
    #tvView,
    #uploadView {
      width: 100%;
      height: 100%;
    }


    #loading {
      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 30px;
    }


    #loading h2 {
      color: var(--primary-color);
    }


    /* ---------------------------------
       DEFAULT TV BACKGROUND
    --------------------------------- */

    #tvView {
      position: relative;

      background:
        radial-gradient(
          circle at top left,
          color-mix(
            in srgb,
            var(--primary-color) 35%,
            transparent
          ),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          color-mix(
            in srgb,
            var(--accent-color) 35%,
            transparent
          ),
          transparent 35%
        ),
        var(--secondary-color);

      overflow: hidden;
    }


    /* ---------------------------------
       BALLOONS & CONFETTI
    --------------------------------- */

    body[data-theme="balloons-confetti"] #tvView {
      background:
        radial-gradient(
          circle at 10% 15%,
          color-mix(
            in srgb,
            var(--primary-color) 40%,
            transparent
          ),
          transparent 18%
        ),
        radial-gradient(
          circle at 90% 15%,
          color-mix(
            in srgb,
            var(--accent-color) 40%,
            transparent
          ),
          transparent 18%
        ),
        radial-gradient(
          circle at 15% 90%,
          color-mix(
            in srgb,
            var(--accent-color) 35%,
            transparent
          ),
          transparent 20%
        ),
        radial-gradient(
          circle at 90% 90%,
          color-mix(
            in srgb,
            var(--primary-color) 35%,
            transparent
          ),
          transparent 20%
        ),
        var(--secondary-color);
    }


    body[data-theme="balloons-confetti"] #tvView::before,
    body[data-theme="balloons-confetti"] #tvView::after {
      content: "";

      position: absolute;

      width: 150px;
      height: 190px;

      border-radius:
        50% 50% 45% 45%;

      background:
        color-mix(
          in srgb,
          var(--primary-color) 75%,
          white
        );

      opacity: 0.28;

      pointer-events: none;

      z-index: 1;

      box-shadow:
        180px 80px 0
        color-mix(
          in srgb,
          var(--accent-color) 75%,
          white
        ),
        350px -30px 0
        color-mix(
          in srgb,
          var(--primary-color) 55%,
          white
        ),
        -180px 240px 0
        color-mix(
          in srgb,
          var(--accent-color) 55%,
          white
        );
    }


    body[data-theme="balloons-confetti"] #tvView::before {
      top: -60px;
      left: -70px;

      transform: rotate(-12deg);
    }


    body[data-theme="balloons-confetti"] #tvView::after {
      bottom: -70px;
      right: -60px;

      transform: rotate(14deg);
    }


    body[data-theme="balloons-confetti"] .photo-area {
      position: relative;

      z-index: 2;
    }


    body[data-theme="balloons-confetti"] #currentPhoto {
      border-radius: 24px;

      box-shadow:
        0 0 0 5px
        color-mix(
          in srgb,
          var(--accent-color) 60%,
          transparent
        ),
        0 20px 70px
        rgba(0, 0, 0, 0.55);
    }


    body[data-theme="balloons-confetti"] .scan-title {
      text-shadow:
        0 0 15px
        color-mix(
          in srgb,
          var(--primary-color) 60%,
          transparent
        );
    }


    /* ---------------------------------
       BIRTHDAY CELEBRATION
    --------------------------------- */

    body[data-theme="birthday-celebration"] #tvView {
      background:
        radial-gradient(
          circle at 20% 15%,
          color-mix(
            in srgb,
            var(--primary-color) 45%,
            transparent
          ),
          transparent 28%
        ),
        radial-gradient(
          circle at 80% 15%,
          color-mix(
            in srgb,
            var(--accent-color) 45%,
            transparent
          ),
          transparent 28%
        ),
        radial-gradient(
          circle at 50% 100%,
          color-mix(
            in srgb,
            var(--primary-color) 25%,
            transparent
          ),
          transparent 35%
        ),
        var(--secondary-color);
    }


    body[data-theme="birthday-celebration"] #tvView::before {
      content: "🎂";

      position: absolute;

      top: 25px;
      left: 50%;

      transform:
        translateX(-50%);

      font-size: 55px;

      opacity: 0.8;

      z-index: 2;

      pointer-events: none;
    }


    body[data-theme="birthday-celebration"] #tvView::after {
      content: "🎉  ✨  🎈  ✨  🎉";

      position: absolute;

      bottom: 25px;
      left: 50%;

      transform:
        translateX(-50%);

      font-size: 28px;

      letter-spacing: 10px;

      opacity: 0.7;

      white-space: nowrap;

      z-index: 2;

      pointer-events: none;
    }


    body[data-theme="birthday-celebration"] .scan-title {
      text-shadow:
        0 0 15px
        color-mix(
          in srgb,
          var(--primary-color) 65%,
          transparent
        ),
        0 0 35px
        color-mix(
          in srgb,
          var(--accent-color) 40%,
          transparent
        );
    }


    body[data-theme="birthday-celebration"] #currentPhoto {
      border-radius: 28px;

      box-shadow:
        0 0 0 5px
        color-mix(
          in srgb,
          var(--primary-color) 55%,
          transparent
        ),
        0 20px 70px
        color-mix(
          in srgb,
          var(--primary-color) 35%,
          rgba(0, 0, 0, 0.5)
        );
    }


    /* ---------------------------------
       COLORFUL PARTY
    --------------------------------- */

    body[data-theme="colorful-party"] #tvView {
      background:
        radial-gradient(
          circle at 5% 15%,
          color-mix(
            in srgb,
            var(--primary-color) 55%,
            transparent
          ),
          transparent 23%
        ),
        radial-gradient(
          circle at 95% 15%,
          color-mix(
            in srgb,
            var(--accent-color) 55%,
            transparent
          ),
          transparent 23%
        ),
        radial-gradient(
          circle at 10% 90%,
          color-mix(
            in srgb,
            var(--accent-color) 45%,
            transparent
          ),
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 90%,
          color-mix(
            in srgb,
            var(--primary-color) 45%,
            transparent
          ),
          transparent 25%
        ),
        var(--secondary-color);
    }


    body[data-theme="colorful-party"] .tv-header {
      background:
        linear-gradient(
          90deg,
          color-mix(
            in srgb,
            var(--primary-color) 25%,
            transparent
          ),
          transparent,
          color-mix(
            in srgb,
            var(--accent-color) 25%,
            transparent
          )
        );
    }


    body[data-theme="colorful-party"] .scan-title {
      font-size: 36px;

      text-shadow:
        0 0 12px
        color-mix(
          in srgb,
          var(--primary-color) 75%,
          transparent
        ),
        0 0 25px
        color-mix(
          in srgb,
          var(--accent-color) 55%,
          transparent
        );
    }


    body[data-theme="colorful-party"] #currentPhoto {
      border-radius: 24px;

      box-shadow:
        0 0 0 5px
        color-mix(
          in srgb,
          var(--accent-color) 55%,
          transparent
        ),
        0 0 0 10px
        color-mix(
          in srgb,
          var(--primary-color) 20%,
          transparent
        ),
        0 20px 70px
        rgba(0, 0, 0, 0.55);
    }


    /* ---------------------------------
       TV HEADER
    --------------------------------- */

    .tv-header {
      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      z-index: 5;

      padding: 24px 32px;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }


    .brand {
      font-size: 24px;

      font-weight: 800;
    }


    .brand span {
      color: var(--primary-color);
    }


    .event-code {
      padding: 10px 16px;

      border-radius: 12px;

      background:
        color-mix(
          in srgb,
          var(--primary-color) 20%,
          transparent
        );

      border:
        1px solid
        color-mix(
          in srgb,
          var(--primary-color) 35%,
          transparent
        );

      font-weight: 700;

      letter-spacing: 2px;
    }


    .event-code span {
      color: var(--accent-color);
    }


    /* ---------------------------------
       PHOTO AREA
    --------------------------------- */

    .photo-area {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 90px 30px 35px;
    }


    #currentPhoto {
      max-width: 97%;

      max-height: 93%;

      width: auto;

      height: auto;

      object-fit: contain;

      border-radius: 18px;

      box-shadow:
        0 20px 70px
        color-mix(
          in srgb,
          var(--primary-color) 30%,
          rgba(0, 0, 0, 0.45)
        );
    }


    /* ---------------------------------
       EMPTY TV
    --------------------------------- */

    #emptyTv {
      text-align: center;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 20px;
    }


    .qr-box {
      background: white;

      padding: 18px;

      border-radius: 20px;

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.3);

      border:
        5px solid
        color-mix(
          in srgb,
          var(--accent-color) 65%,
          white
        );
    }


    #tvQr img {
      display: block;

      width:
        min(
          360px,
          60vw
        );

      height:
        min(
          360px,
          60vw
        );
    }


    .scan-title {
      font-size: 32px;

      font-weight: 800;

      color: var(--primary-color);
    }


    .scan-text {
      max-width: 500px;

      font-size: 18px;

      line-height: 1.5;

      color: #cbd5e1;
    }


    .tv-status {
      position: absolute;

      bottom: 24px;

      left: 32px;

      right: 32px;

      text-align: center;

      color:
        color-mix(
          in srgb,
          var(--accent-color) 70%,
          #94a3b8
        );

      font-size: 14px;
    }


    #uploadView {
      display: none;
    }


    @media (max-width: 700px) {

      .tv-header {
        padding: 18px;
      }


      .brand {
        font-size: 19px;
      }


      .event-code {
        font-size: 12px;

        padding: 8px 10px;
      }


      .scan-title {
        font-size: 25px;
      }


      .scan-text {
        font-size: 16px;
      }


      .photo-area {
        padding:
          80px 20px 40px;
      }


      #currentPhoto {
        max-width: 96%;

        max-height: 88%;
      }

    }

  </style>

</head>


<body>


  <section id="loading">

    <div>

      <h2>
        Loading Captured Moments…
      </h2>

      <p>
        Please wait.
      </p>

    </div>

  </section>


  <section id="tvView">


    <header class="tv-header">


      <div class="brand">

        Captured
        <span>Moments</span>

      </div>


      <div class="event-code">

        EVENT
        <span id="tvCode">
          ------
        </span>

      </div>


    </header>


    <main class="photo-area">


      <div id="emptyTv">


        <div class="qr-box">

          <div id="tvQr"></div>

        </div>


        <div class="scan-title">

          Share Your Photos

        </div>


        <div class="scan-text">

          Scan the QR code with your phone
          to send photos directly to this screen.

        </div>


      </div>


      <img
        id="currentPhoto"
        class="hidden"
        src=""
        alt="Event photo"
      >


    </main>


    <div
      id="tvStatus"
      class="tv-status"
    >

      Ready for photos

    </div>


  </section>


  <section
    id="uploadView"
    class="hidden"
  ></section>


  <script
    type="module"
    src="./app.js"
  ></script>


  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    import {
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    } from "./config.js";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const params =
      new URLSearchParams(
        window.location.search
      );


    const code =
      (params.get("code") || "")
        .toUpperCase();


    async function loadEventDesign() {

      if (!code) {
        return;
      }


      try {

        const {
          data,
          error
        } =
          await supabase.rpc(
            "get_public_event",
            {
              p_code: code
            }
          );


        if (error) {
          throw error;
        }


        const event =
          Array.isArray(data)
            ? data[0]
            : data;


        if (!event) {
          throw new Error(
            "Event not found."
          );
        }


        document.documentElement.style.setProperty(
          "--primary-color",
          event.primary_color || "#2563eb"
        );


        document.documentElement.style.setProperty(
          "--secondary-color",
          event.secondary_color || "#111827"
        );


        document.documentElement.style.setProperty(
          "--accent-color",
          event.accent_color || "#c8a24a"
        );


        if (event.theme) {

          document.body.dataset.theme =
            event.theme;

        }


        console.log(
          "TV design loaded:",
          event.theme
        );


        console.log(
          "TV colors loaded:",
          event.primary_color,
          event.secondary_color,
          event.accent_color
        );


      } catch (error) {

        console.error(
          "Could not load event design:",
          error
        );

      }

    }


    loadEventDesign();

  </script>


</body>

</html>
