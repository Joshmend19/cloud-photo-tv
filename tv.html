<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Instant Moments TV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111827;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    #loading,
    #tvView,
    #uploadView {
      width: 100%;
      height: 100%;
    }

    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    #tvView {
      position: relative;
      background:
        radial-gradient(
          circle at top left,
          rgba(37, 99, 235, 0.35),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(124, 58, 237, 0.35),
          transparent 35%
        ),
        #111827;
    }

    .tv-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
    }

    .brand span {
      color: #60a5fa;
    }

    .event-code {
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      font-weight: 700;
      letter-spacing: 2px;
    }

    .photo-area {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 90px 30px 35px;
    }

    #currentPhoto {
      max-width: 97%;
      max-height: 93%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
    }

    #emptyTv {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .qr-box {
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    #tvQr img {
      display: block;
      width: min(360px, 60vw);
      height: min(360px, 60vw);
    }

    .scan-title {
      font-size: 32px;
      font-weight: 800;
    }

    .scan-text {
      max-width: 500px;
      font-size: 18px;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .tv-status {
      position: absolute;
      bottom: 24px;
      left: 32px;
      right: 32px;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
    }

    #uploadView {
      display: none;
    }

    @media (max-width: 700px) {

      .tv-header {
        padding: 18px;
      }

      .brand {
        font-size: 19px;
      }

      .event-code {
        font-size: 12px;
        padding: 8px 10px;
      }

      .scan-title {
        font-size: 25px;
      }

      .scan-text {
        font-size: 16px;
      }

      .photo-area {
        padding: 80px 20px 40px;
      }

      #currentPhoto {
        max-width: 96%;
        max-height: 88%;
      }
    }
  </style>
</head>

<body>

  <section id="loading">
    <div>
      <h2>Loading Instant Moments…</h2>
      <p>Please wait.</p>
    </div>
  </section>


  <section id="tvView">

    <header class="tv-header">

      <div class="brand">
        Instant <span>Moments</span>
      </div>

      <div class="event-code">
        EVENT <span id="tvCode">------</span>
      </div>

    </header>


    <main class="photo-area">

      <div id="emptyTv">

        <div class="qr-box">
          <div id="tvQr"></div>
        </div>

        <div class="scan-title">
          Share Your Photos
        </div>

        <div class="scan-text">
          Scan the QR code with your phone to send photos
          directly to this screen.
        </div>

      </div>


      <img
        id="currentPhoto"
        class="hidden"
        src=""
        alt="Event photo"
      >

    </main>


    <div
      id="tvStatus"
      class="tv-status"
    >
      Ready for photos
    </div>

  </section>


  <section
    id="uploadView"
    class="hidden"
  ></section>


  <script
    type="module"
    src="./app.js"
  ></script>

</body>
</html>
