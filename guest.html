<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guest Hub | Captured Moments</title>

  <style>
    :root {
      --blue: #2563eb;
      --purple: #7c3aed;
      --orange: #f97316;
      --yellow: #facc15;
      --navy: #172033;
      --light-blue: #f5f8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light-blue);
      color: var(--navy);
    }

    .top-bar {
      height: 6px;
      background: linear-gradient(
        90deg,
        var(--blue),
        var(--purple),
        var(--orange),
        var(--yellow)
      );
    }

    nav {
      background: white;
      padding: 18px 24px;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
      max-width: 1100px;
      margin: auto;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: linear-gradient(
        135deg,
        var(--blue),
        var(--purple)
      );
    }

    .logo span {
      color: var(--blue);
    }

    main {
      min-height: calc(100vh - 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: white;
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 20px 50px rgba(23, 32, 51, 0.10);
      text-align: center;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      background: #eef4ff;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .description {
      margin: 0 auto 10px;
      color: #64748b;
      line-height: 1.6;
      max-width: 430px;
    }

    .event-name {
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 28px;
      font-size: 18px;
    }

    .hub {
      display: grid;
      gap: 12px;
    }

    .hub-button {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px;
      background: white;
      color: var(--navy);
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: 0.2s;
      font-size: 16px;
      font-weight: 700;
    }

    .hub-button:hover {
      border-color: var(--blue);
      background: #f8fbff;
      transform: translateY(-1px);
    }

    .hub-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: #eef4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .hub-text {
      flex: 1;
    }

    .hub-title {
      display: block;
      margin-bottom: 3px;
    }

    .hub-description {
      display: block;
      color: #64748b;
      font-size: 13px;
      font-weight: 400;
    }

    .arrow {
      color: #94a3b8;
      font-size: 20px;
    }

    .section {
      display: none;
      text-align: left;
    }

    .section.active {
      display: block;
    }

    .back-button {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      margin-bottom: 22px;
      font-size: 15px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .section-title .section-icon {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .section-title h2 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .section-title p {
      margin: 0;
      color: #64748b;
      line-height: 1.5;
    }

    .file-label {
      display: block;
      padding: 22px;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      cursor: pointer;
      transition: 0.2s;
      color: #475569;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    .file-label:hover {
      border-color: var(--blue);
      background: #f8fbff;
    }

    #photoInput {
      display: none;
    }

    input[type="email"] {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
    }

    input[type="email"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .primary-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background: linear-gradient(
        135deg,
        var(--blue),
        var(--purple)
      );
      cursor: pointer;
    }

    .primary-button:hover {
      opacity: 0.92;
    }

    .primary-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      min-height: 24px;
      margin-top: 18px;
      font-weight: 600;
      text-align: center;
    }

    .gallery-note {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .card {
        padding: 28px 20px;
        border-radius: 20px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar"></div>

  <nav>
    <div class="logo">
      <div class="logo-mark">✦</div>
      Captured <span>Moments</span>
    </div>
  </nav>

  <main>

    <div class="card">

      <!-- GUEST HUB -->

      <div id="hubSection">

        <div class="icon">
          🎉
        </div>

        <h1>Guest Hub</h1>

        <p class="description">
          Share your memories and be part of the event.
        </p>

        <div
          class="event-name"
          id="eventName"
        >
          Loading event...
        </div>

        <div class="hub">

          <button
            type="button"
            class="hub-button"
            id="uploadPhotosButton"
          >
            <div class="hub-icon">
              📸
            </div>

            <div class="hub-text">
              <span class="hub-title">
                Upload Photos
              </span>

              <span class="hub-description">
                Share your photos with everyone
              </span>
            </div>

            <span class="arrow">
              →
            </span>
          </button>


          <button
            type="button"
            class="hub-button hidden"
            id="guestbookButton"
          >
            <div class="hub-icon">
              📖
            </div>

            <div class="hub-text">
              <span class="hub-title">
                Guestbook
              </span>

              <span class="hub-description">
                Leave a message for the host
              </span>
            </div>

            <span class="arrow">
              →
            </span>
          </button>


          <button
            type="button"
            class="hub-button hidden"
            id="rsvpButton"
          >
            <div class="hub-icon">
              📋
            </div>

            <div class="hub-text">
              <span class="hub-title">
                RSVP
              </span>

              <span class="hub-description">
                Let the host know if you're attending
              </span>
            </div>

            <span class="arrow">
              →
            </span>
          </button>


          <button
            type="button"
            class="hub-button"
            id="galleryButton"
          >
            <div class="hub-icon">
              🖼️
            </div>

            <div class="hub-text">
              <span class="hub-title">
                View Gallery
              </span>

              <span class="hub-description">
                See photos from the event
              </span>
            </div>

            <span class="arrow">
              →
            </span>
          </button>


          <button
            type="button"
            class="hub-button"
            id="galleryRequestButton"
          >
            <div class="hub-icon">
              📧
            </div>

            <div class="hub-text">
              <span class="hub-title">
                Get Gallery Link
              </span>

              <span class="hub-description">
                Receive the gallery by email
              </span>
            </div>

            <span class="arrow">
              →
            </span>
          </button>

        </div>

        <div
          class="status"
          id="hubStatus"
        ></div>

      </div>


      <!-- UPLOAD PHOTOS -->

      <div
        class="section"
        id="uploadSection"
      >

        <button
          type="button"
          class="back-button"
          id="backFromUpload"
        >
          ← Back to Guest Hub
        </button>

        <div class="section-title">

          <div class="section-icon">
            📸
          </div>

          <h2>Upload Photos</h2>

          <p>
            Share a photo from the event.
          </p>

        </div>


        <label
          class="file-label"
          for="photoInput"
          id="fileLabel"
        >
          📷 Choose a photo
        </label>

        <input
          type="file"
          id="photoInput"
          accept="image/*"
        >


        <input
          type="email"
          id="emailInput"
          placeholder="Your email address"
          autocomplete="email"
        >


        <button
          type="button"
          class="primary-button"
          id="uploadBtn"
        >
          Send Photo to TV
        </button>


        <div
          class="status"
          id="uploadStatus"
        ></div>


        <div class="gallery-note">
          Enter your email so you can receive the event gallery
          when the event is over.
        </div>

      </div>


      <!-- GALLERY REQUEST -->

      <div
        class="section"
        id="galleryRequestSection"
      >

        <button
          type="button"
          class="back-button"
          id="backFromGalleryRequest"
        >
          ← Back to Guest Hub
        </button>

        <div class="section-title">

          <div class="section-icon">
            📧
          </div>

          <h2>Get Gallery Link</h2>

          <p>
            Enter your email and we'll send you the event gallery.
          </p>

        </div>


        <input
          type="email"
          id="galleryEmailInput"
          placeholder="Your email address"
          autocomplete="email"
        >


        <button
          type="button"
          class="primary-button"
          id="galleryRequestSubmit"
        >
          Send Me the Gallery
        </button>


        <div
          class="status"
          id="galleryRequestStatus"
        ></div>

      </div>

    </div>

  </main>


 <script
  type="module"
  src="./guest.js?v=3"
></script>

</body>
</html>
