<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Captured Moments</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5f2;
      color: #333;
      min-height: 100vh;
    }

    .container {
      width: min(92%, 700px);
      margin: 0 auto;
      padding: 40px 0;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .hub-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hub-button {
      width: 100%;
      padding: 17px 20px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .hub-button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .hub-button:active {
      transform: translateY(0);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="email"],
    input[type="file"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    input[type="file"] {
      background: white;
    }

    .primary-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary-button {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      color: #333;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }

    .status {
      margin-top: 15px;
      text-align: center;
      font-size: 15px;
    }

    .file-label {
      display: block;
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    .back-button {
      margin-bottom: 20px;
      border: none;
      background: none;
      color: #555;
      font-size: 15px;
      cursor: pointer;
      padding: 0;
    }

    .back-button:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- =========================
         GUEST HUB
    ========================== -->

    <section
      id="hubSection"
      class="card"
    >
      <h1>Captured Moments</h1>

      <p
        id="eventName"
        class="subtitle"
      >
        Loading event...
      </p>

      <div class="hub-buttons">

        <button
          type="button"
          class="hub-button"
          id="uploadPhotosButton"
        >
          📸 Upload Photos
        </button>

        <button
          type="button"
          class="hub-button"
          id="guestbookButton"
          style="display: none;"
        >
          📖 Guestbook
        </button>

        <button
          type="button"
          class="hub-button"
          id="rsvpButton"
          style="display: none;"
        >
          📋 RSVP
        </button>

        <button
          type="button"
          class="hub-button"
          id="galleryButton"
        >
          🖼️ View Gallery
        </button>

        <button
          type="button"
          class="hub-button"
          id="galleryRequestButton"
        >
          📧 Get Gallery Link
        </button>

      </div>
    </section>


    <!-- =========================
         UPLOAD PHOTOS
    ========================== -->

    <section
      id="uploadSection"
      class="card hidden"
    >

      <button
        type="button"
        class="back-button"
        id="backFromUpload"
      >
        ← Back
      </button>

      <h2>Upload Photos</h2>

      <div class="form-group">

        <label for="photoInput">
          Choose Photos
        </label>

        <input
          type="file"
          id="photoInput"
          accept="image/jpeg,image/png,image/webp"
          multiple
        />

        <div
          id="fileLabel"
          class="file-label"
        >
          JPG, PNG, or WEBP
        </div>

      </div>

      <div class="form-group">

        <label for="emailInput">
          Your Email
          <span style="font-weight: normal; color: #777;">
            (optional)
          </span>
        </label>

        <input
          type="email"
          id="emailInput"
          placeholder="you@example.com"
        />

      </div>

      <button
        type="button"
        class="primary-button"
        id="uploadBtn"
      >
        Upload Photos
      </button>

      <div
        id="uploadStatus"
        class="status"
      ></div>

    </section>


    <!-- =========================
         GALLERY REQUEST
    ========================== -->

    <section
      id="galleryRequestSection"
      class="card hidden"
    >

      <button
        type="button"
        class="back-button"
        id="backFromGalleryRequest"
      >
        ← Back
      </button>

      <h2>Get Your Gallery Link</h2>

      <p class="subtitle">
        Enter your email and we'll send you the event gallery link.
      </p>

      <div class="form-group">

        <label for="galleryEmailInput">
          Email Address
        </label>

        <input
          type="email"
          id="galleryEmailInput"
          placeholder="you@example.com"
        />

      </div>

      <button
        type="button"
        class="primary-button"
        id="galleryRequestSubmit"
      >
        Send Gallery Link
      </button>

      <div
        id="galleryRequestStatus"
        class="status"
      ></div>

    </section>

  </div>


  <script
    type="module"
    src="./guest.js?v=3"
  ></script>

</body>
</html>
