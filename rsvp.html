  <div class="top-bar"></div>

  <main class="container">

    <div class="brand">
      <h1>Captured Moments</h1>
      <p>Your moments, captured and shared.</p>
    </div>

    <div class="card">

      <div class="event-header">
        <h2 id="eventName">Loading event...</h2>
        <p id="eventDate"></p>
      </div>

      <form id="rsvpForm">

        <div class="form-group">
          <label for="rsvpName">Your Name *</label>
          <input
            type="text"
            id="rsvpName"
            placeholder="Enter your name"
            required
          />
        </div>

        <div class="form-group">
          <label for="rsvpEmail">Email</label>
          <input
            type="email"
            id="rsvpEmail"
            placeholder="you@example.com"
          />
        </div>

        <div class="form-group">
          <label>Will you be attending? *</label>

          <div class="radio-group">

            <label class="radio-option">
              <input
                type="radio"
                name="attending"
                value="true"
                checked
              />
              <span>Yes, I'll be there</span>
            </label>

            <label class="radio-option">
              <input
                type="radio"
                name="attending"
                value="false"
              />
              <span>No, I can't make it</span>
            </label>

          </div>
        </div>

        <div class="form-group" id="guestCountGroup">
          <label for="guestCount">Number of Guests</label>

          <select id="guestCount">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </div>

        <div class="form-group">
          <label for="rsvpMessage">
            Message
            <span style="font-weight: normal; color: #888;">
              (optional)
            </span>
          </label>

          <textarea
            id="rsvpMessage"
            placeholder="Leave a message for the host..."
          ></textarea>
        </div>

        <button
          type="submit"
          class="submit-btn"
          id="submitRsvpBtn"
        >
          Submit RSVP
        </button>

        <div
          id="rsvpStatus"
          class="status"
        ></div>

      </form>

      <div
        id="successMessage"
        class="success"
        style="display: none;"
      >
        <div class="success-icon">✓</div>

        <h2>RSVP Received!</h2>

        <p id="successText">
          Thank you for responding.
        </p>
      </div>

    </div>

    <div class="footer">
      Captured Moments · Your moments, captured and shared.
    </div>

  </main>

  <script
    type="module"
    src="rsvp.js"
  ></script>

  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    import {
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    } from "./config.js";

    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const params =
      new URLSearchParams(
        window.location.search
      );

    const code =
      (params.get("code") || "")
        .toUpperCase();

    if (code) {

      try {

        const {
          data,
          error
        } =
          await supabase.rpc(
            "get_public_event",
            {
              p_code: code
            }
          );

        if (error) {
          throw error;
        }

        const event =
          Array.isArray(data)
            ? data[0]
            : data;

        if (event) {

          document.documentElement.style.setProperty(
            "--primary-color",
            event.primary_color || "#c9a227"
          );

          document.documentElement.style.setProperty(
            "--secondary-color",
            event.secondary_color || "#fffdf8"
          );

          document.documentElement.style.setProperty(
            "--accent-color",
            event.accent_color || "#d8b4b4"
          );

          if (event.theme) {
            document.body.dataset.theme =
              event.theme;
          }

        }

      } catch (error) {

        console.error(
          "RSVP THEME ERROR:",
          error
        );

      }

    }

  </script>
