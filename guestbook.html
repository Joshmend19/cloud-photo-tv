  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary-color: #b08d57;
      --secondary-color: #ffffff;
      --accent-color: #c9a0a0;
      --page-background: #f8f6f3;
      --text-color: #333;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--page-background);
      color: var(--text-color);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* =========================
       EVENT THEME PATTERNS
       ========================= */

    body::before {
      content: "";
      position: fixed;
      top: -50px;
      left: 80px;
      width: calc(100% + 600px);
      height: calc(100% + 100px);
      padding: 20px;
      font-size: 42px;
      line-height: 2.15;
      letter-spacing: 3px;
      white-space: pre;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

  ></script>

  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    import {
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    } from "./config.js";

    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const params =
      new URLSearchParams(
        window.location.search
      );

    const code =
      (params.get("code") || "")
        .toUpperCase();

    if (code) {

      try {

        const {
          data,
          error
        } =
          await supabase.rpc(
            "get_public_event",
            {
              p_code: code
            }
          );

        if (error) {
          throw error;
        }

        const event =
          Array.isArray(data)
            ? data[0]
            : data;

        if (event) {

          document.documentElement.style.setProperty(
            "--primary-color",
            event.primary_color || "#b08d57"
          );

          document.documentElement.style.setProperty(
            "--secondary-color",
            event.secondary_color || "#ffffff"
          );

          document.documentElement.style.setProperty(
            "--accent-color",
            event.accent_color || "#c9a0a0"
          );

          if (event.theme) {
            document.body.dataset.theme =
              event.theme;
          }

        }

      } catch (error) {

        console.error(
          "GUESTBOOK THEME ERROR:",
          error
        );

      }

    }

  </script>
